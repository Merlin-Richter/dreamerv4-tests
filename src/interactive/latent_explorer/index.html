<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Latent explorer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    header .meta { color: #888; font-size: 0.85rem; }
    button {
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #363636; }
    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #sliders {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
      border-right: 1px solid #333;
    }
    .token-col {
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 8px;
    }
    .token-col h2 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }
    .row {
      display: grid;
      grid-template-columns: 28px 1fr 42px;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
      font-size: 0.7rem;
    }
    .row label { color: #666; text-align: right; }
    .row input[type="range"] { width: 100%; }
    .row span { color: #bbb; font-variant-numeric: tabular-nums; }
    #preview {
      width: min(42vw, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 10px;
    }
    #img {
      image-rendering: pixelated;
      border: 1px solid #333;
      background: #000;
      max-width: 100%;
    }
    #status { color: #888; font-size: 0.8rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>Bottleneck latent explorer</h1>
    <span class="meta" id="meta"></span>
    <button type="button" id="btn-reset">Reset (0)</button>
    <button type="button" id="btn-random">Random</button>
    <button type="button" id="btn-nudge">Nudge ±0.1</button>
    <button type="button" id="btn-sample">Load random frame</button>
  </header>
  <main>
    <div id="sliders"></div>
    <div id="preview">
      <img id="img" alt="decoded frame" width="256" height="256" />
      <div id="status">loading…</div>
    </div>
  </main>
  <script>
    let nLatents = 4, bottleneckDim = 64;
    let values = [];
    let decodeTimer = null;
    let busy = false;

    function initValues(fill = 0) {
      values = Array.from({ length: nLatents }, () =>
        Array.from({ length: bottleneckDim }, () => fill)
      );
    }

    function buildSliders() {
      const root = document.getElementById("sliders");
      root.innerHTML = "";
      for (let t = 0; t < nLatents; t++) {
        const col = document.createElement("div");
        col.className = "token-col";
        col.innerHTML = `<h2>token ${t}</h2>`;
        for (let d = 0; d < bottleneckDim; d++) {
          const row = document.createElement("div");
          row.className = "row";
          const id = `t${t}d${d}`;
          row.innerHTML = `
            <label for="${id}">${d}</label>
            <input type="range" id="${id}" min="-1" max="1" step="0.02" value="0" />
            <span id="${id}-v">0.00</span>`;
          const slider = row.querySelector("input");
          const valSpan = row.querySelector("span");
          slider.addEventListener("input", () => {
            const v = parseFloat(slider.value);
            values[t][d] = v;
            valSpan.textContent = v.toFixed(2);
            scheduleDecode();
          });
          col.appendChild(row);
        }
        root.appendChild(col);
      }
    }

    function syncSlidersFromValues() {
      for (let t = 0; t < nLatents; t++) {
        for (let d = 0; d < bottleneckDim; d++) {
          const slider = document.getElementById(`t${t}d${d}`);
          const v = values[t][d];
          slider.value = v;
          document.getElementById(`t${t}d${d}-v`).textContent = v.toFixed(2);
        }
      }
    }

    function scheduleDecode() {
      clearTimeout(decodeTimer);
      decodeTimer = setTimeout(decode, 80);
    }

    async function decode() {
      if (busy) { scheduleDecode(); return; }
      busy = true;
      document.getElementById("status").textContent = "decoding…";
      try {
        const res = await fetch("/decode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ latents: values }),
        });
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob();
        document.getElementById("img").src = URL.createObjectURL(blob);
        document.getElementById("status").textContent = "ok";
      } catch (e) {
        document.getElementById("status").textContent = String(e);
      } finally {
        busy = false;
      }
    }

    async function loadInfo() {
      const res = await fetch("/api/info");
      const info = await res.json();
      nLatents = info.n_latents;
      bottleneckDim = info.bottleneck_dim;
      document.getElementById("meta").textContent =
        `${nLatents}×${bottleneckDim} latents · ${info.img_w}×${info.img_h} decode`;
      document.getElementById("img").width = info.img_w * 4;
      document.getElementById("img").height = info.img_h * 4;
      initValues(0);
      buildSliders();
      decode();
    }

    document.getElementById("btn-reset").onclick = () => {
      initValues(0);
      syncSlidersFromValues();
      scheduleDecode();
    };

    document.getElementById("btn-random").onclick = () => {
      for (let t = 0; t < nLatents; t++) {
        for (let d = 0; d < bottleneckDim; d++) {
          values[t][d] = Math.random() * 2 - 1;
        }
      }
      syncSlidersFromValues();
      scheduleDecode();
    };

    document.getElementById("btn-nudge").onclick = () => {
      for (let t = 0; t < nLatents; t++) {
        for (let d = 0; d < bottleneckDim; d++) {
          const delta = Math.random() * 0.2 - 0.1;
          values[t][d] = Math.max(-1, Math.min(1, values[t][d] + delta));
        }
      }
      syncSlidersFromValues();
      scheduleDecode();
    };

    document.getElementById("btn-sample").onclick = async () => {
      document.getElementById("status").textContent = "encoding sample…";
      try {
        const res = await fetch("/encode_sample", { method: "POST" });
        if (!res.ok) throw new Error(await res.text());
        values = await res.json();
        syncSlidersFromValues();
        scheduleDecode();
      } catch (e) {
        document.getElementById("status").textContent = String(e);
      }
    };

    loadInfo();
  </script>
</body>
</html>
