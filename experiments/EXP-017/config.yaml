# EXP-017 — FF9 v2 memory-token baseline (D-024)
# The architectural baseline for the memory-token line (ops 1&2: write-mem<-latents, read-mem->latents).
# Same budget/data/architecture as EXP-010 (FF7) / EXP-012 (vanilla); differs only in the carrier
# (distinct MEMORY tokens vs FF7 registers) and the loss (FF9 v2 memory-only-sufficiency vs FF7).
# Decided in haste (late-night, Merlin asked for a relevant overnight run); the full detached relay
# (op-3, T-014) is deliberately NOT built tonight (the verifier flagged it as bug-prone) — built next.

provenance:
  decision: D-024 (FF9 v2 build); launched per Merlin's overnight-run request 2026-06-14
  code: master @ <resolved at launch — see NOTES.md>
  tokenizer: trained_autoencoder.pt        # frozen, same as EXP-009/010/012
  data: occluded.npy + occluded_actions.npy
  probe_for_eval: 5503e75 (frozen) — eval DEFERRED (needs generate_full_state_memory)

architecture:                              # DynamicsModelConfig + FF9 additions
  embedding_dim: 256
  depth: 8
  n_heads: 16
  max_temporal_length: 16
  max_sampling_steps: 128
  inference_steps: 4
  n_registers: 4                           # pure scratch (FF9 does NOT use registers)
  n_memory: 4                              # distinct memory-token carrier (D-024)
  bottleneck_dim: 64
  n_latents: 4
  context_signal: 0.9
  use_full_state_memory: true
  ff9_k: 3                                 # FF9 v2 lookahead (random j in {1..3}; loss on 1..j; un-ramped)

training:
  epochs: 100            # matches EXP-010/012
  batch_size: 32         # B=32 peak ~4.5 GB / 8 GB (verified)
  lr: 3.0e-4             # cosine decay -> ~1e-6
  seed: 0
  ff9: 3
  lambda_ff9: 1.0
  fresh: true
  val_fraction: 0.05
  wandb: false           # skipped for unattended robustness; per-epoch metrics in train.log

command: >
  venv/Scripts/python.exe -u src/D_dynamics_model/train_dynamics_model.py
  --frames occluded.npy --actions occluded_actions.npy --tokenizer trained_autoencoder.pt
  --epochs 100 --batch-size 32 --lr 3e-4 --seed 0 --ff9 3 --n-memory 4 --lambda-ff9 1.0 --fresh
  --checkpoint experiments/EXP-017/ff9v2_s0.pt

eval_after_train_TODO: >
  (tomorrow) build generate_full_state_memory + memory-sufficiency probe, then:
  python -m src.probe.revisit_probe --dynamics experiments/EXP-017/ff9v2_s0.pt
  --tokenizer trained_autoencoder.pt --out experiments/EXP-017/results.json
  vs vanilla_s0 (EXP-012) + ff7_k3 (EXP-010); expect color ~FF7 (within-window sufficiency only).
